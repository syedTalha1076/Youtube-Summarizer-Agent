[project]
name = "youtube-summarizer-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syed Talha Ali Shah", email = "syedtalhaa1076@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain-core>=1.6.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
youtube-summarizer-agent = "youtube_summarizer_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
